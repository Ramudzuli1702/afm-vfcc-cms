plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.4.0'
}

group = 'com.afmvfcc'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_22
    targetCompatibility = JavaVersion.VERSION_22
}

application {
    mainClass = 'com.afmvfcc.Main'
    applicationDefaultJvmArgs = [
        '--add-opens', 'javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
        '--add-opens', 'javafx.base/com.sun.javafx.reflect=ALL-UNNAMED'
    ]
}

task runPasswordTool(type: JavaExec, dependsOn: compileJava) {
    group = 'application'
    description = 'Run the password manager utility'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.afmvfcc.PasswordTool'
    standardInput = System.in
}

javafx {
    version = '22'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing']
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'com.itextpdf:itext7-core:7.2.5'
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation 'org.apache.pdfbox:pdfbox:3.0.2'
    implementation 'io.javalin:javalin:6.3.0'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

        // ── QR code generation (mobile app connect screen) ──
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

        // ── YouTube Data API v3 (for Broadcast module) ──
    implementation 'com.google.apis:google-api-services-youtube:v3-rev20240514-2.0.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'
    implementation 'com.google.http-client:google-http-client-gson:1.43.3'
}

shadowJar {
    manifest {
        attributes 'Main-Class': 'com.afmvfcc.Main'
    }
    archiveBaseName.set('AFM_VFCC_CMS')
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.EC'
}

tasks.build.dependsOn shadowJar

// ==================== CUSTOM RUNTIME & INSTALLER ====================

tasks.register('createRuntime', Exec) {
    dependsOn shadowJar
    group = 'distribution'
    description = 'Creates minimal custom JRE with JavaFX + required modules'

    doFirst {
        // jlink refuses to write to an output directory that already exists
        delete 'build/runtime'
    }

    commandLine 'jlink',
        '--module-path', "build/libs/AFM_VFCC_CMS-1.0.0.jar;C:\\javafx-jmods-22.0.2",
        '--add-modules', 'javafx.controls,javafx.fxml,javafx.swing,' +
                         'java.base,java.logging,java.sql,java.desktop,java.xml,' +
                         'java.naming,jdk.crypto.ec,jdk.httpserver,' +
                         'java.net.http',
        '--output', 'build/runtime',
        '--strip-debug',
        '--compress', '1',
        '--no-header-files',
        '--no-man-pages'
}

tasks.register('createInstaller', Exec) {
    dependsOn createRuntime
    group = 'distribution'
    description = 'Creates clean professional Windows .exe installer with icon and license agreement'

    doFirst {
        // jpackage's --input dir becomes the installed app's "app\" folder
        // verbatim, so the Broadcast module's bundled tools (found by
        // BroadcastController next to the running jar) need to be copied in
        // here too - otherwise the packaged .exe has no ffmpeg/yt-dlp/cookies
        // at all, even though they work fine under `gradle run` from the
        // project root.
        ['ffmpeg.exe', 'yt-dlp.exe', 'cookies.txt'].each { name ->
            def src = file(name)
            if (src.exists()) {
                copy {
                    from src
                    into 'build/libs'
                }
            } else {
                logger.warn("[createInstaller] ${name} not found in project root - the packaged app won't have it either.")
            }
        }
    }

    commandLine 'jpackage',
        '--runtime-image', 'build/runtime',
        '--input', 'build/libs',
        '--name', 'AFM_VFCC_CMS',
        '--main-jar', 'AFM_VFCC_CMS-1.0.0.jar',
        '--main-class', 'com.afmvfcc.Main',
        '--type', 'exe',
        '--dest', 'build/dist',

        // === Professional & Friendly Options ===
        '--app-version', '1.0.0',
        '--vendor', 'Ralidzhivha RR',
        '--icon', 'src/main/resources/com/afmvfcc/images/afm_logo.ico',

        '--license-file', 'src/main/resources/com/afmvfcc/license/AFM_VFCC_Terms.txt', 

        '--win-dir-chooser',
        '--win-shortcut',
        '--win-menu',
        '--win-per-user-install',

        // JVM flags
        '--java-options', '--add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
        '--java-options', '--add-opens javafx.base/com.sun.javafx.reflect=ALL-UNNAMED'
}

tasks.register('createFullInstaller', Exec) {
    dependsOn createInstaller
    group = 'distribution'
    description = 'Wraps the app installer with a bundled MySQL Server prerequisite into one setup .exe ' +
                  '(build/dist/AFM_VFCC_CMS_Setup.exe). Java needs no separate bundling - createInstaller ' +
                  'already embeds a custom jlink runtime, so the app installer is self-contained for Java.'

    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
        '-File', 'installer/build-installer.ps1'
}